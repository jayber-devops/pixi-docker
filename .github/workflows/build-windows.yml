name: Build

on:
  push:
    branches:
      - main
  pull_request:

env:
  DEFAULT_BASE_IMAGE: ubuntu:noble

jobs:
  version:
    name: Check if version changed
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.push.outputs.push }}
      version-changed: ${{ steps.version-metadata.outputs.changed }}
      new-version: ${{ steps.version-metadata.outputs.newVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Quantco/ui-actions/version-metadata@5bfb8cebf0801e07c6a1c208a35b41637a3ff7fa # v1.0.20
        id: version-metadata
        with:
          file: Windows.Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
          version-extraction-override: 'regex:ARG PIXI_VERSION=(.*)'
      - name: Determine if pushing images
        id: push
        run: echo push=${{ steps.version-metadata.outputs.changed == 'true' && github.event_name == 'push' && github.ref_name == 'main' }} >> $GITHUB_OUTPUT

  build:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base-image:
         # https://mcr.microsoft.com/
         - mcr.microsoft.com/windows/nanoserver:ltsc2025
         - mcr.microsoft.com/windows/server:ltsc2025
         - mcr.microsoft.com/windows/servercore:ltsc2025
         - mcr.microsoft.com/windows/nanoserver:ltsc2022
         - mcr.microsoft.com/windows/server:ltsc2022
         - mcr.microsoft.com/windows/servercore:ltsc2022
         - mcr.microsoft.com/windows:ltsc2019
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set image variables
      id: image-variables
      env:
        IMAGE: ${{ matrix.base-image }}
      run: |
        import os

        base_image = "${{ matrix.base-image }}"
        tag = base_image.split(":")[-1]
        platforms = "windows/amd64"
        is_default = "true" if base_image == "${{ env.DEFAULT_BASE_IMAGE }}" else "false"

        GITHUB_OUTPUT = os.environ["GITHUB_OUTPUT"]
        with open(GITHUB_OUTPUT, "a") as f:
            f.write(f"tag={tag}\n")
            f.write(f"platforms={platforms}\n")
            f.write(f"is-default={is_default}\n")
      shell: python
    - name: Get docker metadata
      id: metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |-
          ghcr.io/jayber-devops/pixi
        flavor: latest=false
        # latest
        # base-image
        # major.minor.patch
        # major.minor.patch-base-image
        tags: |
            type=raw,value=latest,priority=1000,enable=${{ steps.image-variables.outputs.is-default }}
            type=raw,value=${{ steps.image-variables.outputs.tag }},priority=900
            type=semver,pattern={{version}},enable=${{ steps.image-variables.outputs.is-default }},value=${{ needs.version.outputs.new-version }},priority=800
            type=semver,pattern={{version}}-${{ steps.image-variables.outputs.tag }},value=${{ needs.version.outputs.new-version }},priority=500
    - name: Setup docker buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        # Use the Windows Docker daemon so the builder can resolve Windows
        # base-image manifests against the runner's OS version.
        driver: docker
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker images
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        # provenance: false is needed to avoid unkown/unknown os/arch on ghcr
        # see: https://github.com/docker/build-push-action/issues/820
        provenance: false
        # load: true loads the image into the local Docker daemon for testing, but only works
        # with single-platform builds. For releases we build multi-platform and push to registry.
        platforms: ${{ needs.version.outputs.push == 'true' && steps.image-variables.outputs.platforms || 'windows/amd64' }}
        push: ${{ needs.version.outputs.push == 'true' }}
        load: ${{ needs.version.outputs.push != 'true' }}
        build-args: |-
          BASE_IMAGE=${{ matrix.base-image }}
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.image-variables.outputs.tag }}
        path: ${{ steps.metadata.outputs.bake-file }}
    - name: Run tests
      env:
        TEST_IMAGE: ${{ needs.version.outputs.push == 'true' && format('ghcr.io/jayber-devops/pixi@{0}', steps.build.outputs.digest) || steps.build.outputs.imageid }}
      run: |
        docker images
        # Test the pixi binary is available
        docker run --rm $TEST_IMAGE pixi --version
        # Test end-to-end pixi workflow
        docker run --rm $TEST_IMAGE sh -c "mkdir app && cd app && pixi init && pixi add python && pixi run python --version"
        # Test uv pypi integration
        docker run --rm $TEST_IMAGE sh -c "mkdir app && cd app && pixi init --format pyproject && pixi run python --version"
        # Test pixi global binaries are in PATH
        docker run --rm $TEST_IMAGE sh -c "pixi global install rsync && rsync --version"
    - name: Image digest
      run: echo ${{ steps.build.outputs.digest }}

  release:
    needs: [version, build]
    runs-on: windows-latest
    permissions:
      contents: write
    if: needs.version.outputs.push == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push ${{ needs.version.outputs.new-version }}-Windows tag
        run: |
          git tag ${{ needs.version.outputs.new-version }}-Windows
          git push origin ${{ needs.version.outputs.new-version }}-Windows
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.version.outputs.new-version }}-Windows
